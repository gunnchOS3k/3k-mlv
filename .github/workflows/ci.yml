name: 3k MLV CI

on:
  pull_request:
  push:
    branches: [revival/gunnchos-world-workspace-v1, world/home-7gc-campus-gallery-v2, world/7gc-airan-network-twin-extension-v3, main]

jobs:
  privacy-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Assert node_modules is not tracked
        run: bash scripts/assert-no-tracked-node-modules.sh
      - name: No secrets scan
        run: bash scripts/scan-no-secrets.sh
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 7GC campus artifacts
        run: node scripts/build-campus-artifacts.mjs
      - name: In-memory privacy harness
        run: node --test tests/privacy/*.test.mjs
      - name: 7GC campus source fidelity
        run: node --test tests/campus/*.test.mjs
      - name: Network Twin gates
        run: node --test tests/network_twin/*.test.mjs
      - name: Network Twin artifacts
        run: node scripts/build-network-twin-artifacts.mjs
      - name: Local PGlite PostgreSQL RLS
        run: node scripts/run-local-postgres-rls.mjs
      - name: Typecheck
        run: pnpm type-check
      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
